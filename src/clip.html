<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>workLog · 悬浮球</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./clip.css">
</head>
<body class="clip-page">
  <div class="clip" id="clip" title="点击展开 / 收起主面板 · 拖动可移动">
    <div class="clip__body">
      <div class="clip__row1">
        <button class="rec-btn" id="recBtn" title="开始 / 停止计时"><span class="dot"></span></button>
        <span class="clip__state" id="clipState">空闲</span>
        <span class="clip__dots" id="clipDots"><span></span><span></span><span></span></span>
        <span class="clip__spacer"></span>
        <span class="clip__timer" id="clipTimer">00:00</span>
      </div>
      <div class="clip__row2">
        <span class="clip__task" id="clipTask"></span>
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <script type="module" src="./clip.js"></script>
</body>
</html>
