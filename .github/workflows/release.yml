name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release, e.g. v0.2.7"
        required: true
        default: "v0.2.7"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundle: app
          - platform: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform != 'macos-latest'

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform == 'macos-latest'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Install dmgbuild
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgvenv"
          "$RUNNER_TEMP/dmgvenv/bin/pip" install --quiet dmgbuild

      - name: Build macOS app
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          npm run tauri -- build --target universal-apple-darwin --bundles app
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          # ad-hoc 签名：没有 Developer ID 也能保证包结构完整；Gatekeeper 仍需右键打开
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          VERSION="${{ inputs.version || github.ref_name }}"
          "$RUNNER_TEMP/dmgvenv/bin/dmgbuild" -s .github/dmg-settings.py \
            -D "app=$PWD/$APP" \
            -D "icon=$PWD/src-tauri/icons/icon.icns" \
            "workLog" "workLog_${VERSION#v}_universal.dmg"

      - name: Build Windows installer
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: npm run tauri -- build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-bundle
          path: |
            workLog_*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: find artifacts -type f -maxdepth 6 -print

      - name: Write checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.dmg' -o -name '*.exe' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: "workLog ${{ inputs.version || github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/SHA256SUMS.txt
          overwrite_files: true
          body: |
            ## workLog ${{ inputs.version || github.ref_name }}

            macOS 与 Windows 安装包见下方 Assets。

            ### 安装
            - macOS：下载 `workLog_*_universal.dmg`，把 workLog 拖入 Applications；首次打开如被拦截，右键 App →「打开」。
            - Windows：下载 `workLog_*_x64-setup.exe`，SmartScreen 选择「更多信息 → 仍要运行」；安装器会按需安装 WebView2。

            ### 本次更新
            - 修复上滑面板打开后目标行没有贴在字段栏下方（双端）
            - 修改项目名会同步到该项目全部任务，汇总里不再出现新旧两个项目名
            - Windows：展开 / 收起改为基于悬浮球的 24px 短滑动，不再从屏幕顶部飞入
            - Windows：计时开始 / 停止时重新按中心定位悬浮球，修复横向漂移
            - Windows：移除导致 WebView2 创建失败的 additionalBrowserArgs，恢复 v0.2.0 启动路径
            - macOS：托盘只创建一次，并使用系统模板图标
            - 新图标：白底黑色记事板，移除主面板拖动把手
            - 性能：缓存面板可见状态、打开详情不再整表重建
            - 单实例：重复启动在创建窗口前退出并唤出已有实例


