name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release, e.g. v0.3.0"
        required: true
        default: "v0.3.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundle: app
          - platform: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform != 'macos-latest'

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform == 'macos-latest'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Install dmgbuild
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgvenv"
          "$RUNNER_TEMP/dmgvenv/bin/pip" install --quiet dmgbuild

      - name: Build macOS app
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          npm run tauri -- build --target universal-apple-darwin --bundles app
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          # ad-hoc 签名：没有 Developer ID 也能保证包结构完整；Gatekeeper 仍需右键打开
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          VERSION="${{ inputs.version || github.ref_name }}"
          "$RUNNER_TEMP/dmgvenv/bin/dmgbuild" -s .github/dmg-settings.py \
            -D "app=$PWD/$APP" \
            -D "icon=$PWD/src-tauri/icons/icon.icns" \
            "workLog" "workLog_${VERSION#v}_universal.dmg"

      - name: Build Windows installer
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: npm run tauri -- build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-bundle
          path: |
            workLog_*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: find artifacts -type f -maxdepth 6 -print

      - name: Write checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.dmg' -o -name '*.exe' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: "workLog ${{ inputs.version || github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/SHA256SUMS.txt
          overwrite_files: true
          body: |
            ## workLog ${{ inputs.version || github.ref_name }}

            macOS 与 Windows 安装包见下方 Assets。

            ### 安装
            - macOS：下载 `workLog_*_universal.dmg`，把 workLog 拖入 Applications；首次打开如被拦截，右键 App →「打开」。
            - Windows：下载 `workLog_*_x64-setup.exe`，SmartScreen 选择「更多信息 → 仍要运行」；安装器不再安装 WebView2，请确保系统已有 WebView2 Runtime。

            ### 本次更新
            - macOS 仅状态栏运行，不显示 Dock 图标 / 应用菜单；Windows 不在任务栏显示
            - 日报甘特：项目一行，任务-阶段各自一条时间条，保持小时刻度；悬浮只显示当前任务/阶段
            - 点击开始计时自动收回主面板
            - AI 报告：使用全部数据库字段与自定义字段，不在正文写单任务耗时；新增目标字数与「恢复为固定模板」
            - Windows 收起主面板不再闪一帧
            - 报告文本全量展示，不再内部滚动
            - 任务标签改为「待办」
            - 汇总底部新增按日区间 / 项目名导出全量数据库数据（CSV / Excel，项目-任务 JOIN 阶段）
            - 设置底部移除工作时间提示；截止日期标注选填
            - 项目名 / 优先级筛选栏双击取消筛选
            - 新图标：白底深灰简笔画、正方形板身、夹子居中；悬浮球计时 00:00:00


