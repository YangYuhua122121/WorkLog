name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: JS syntax
        run: |
          node --check src/app.js
          node --check src/api.js
          node --check src/clip.js
      - name: Rust check
        shell: bash
        working-directory: src-tauri
        run: |
          set +e
          cargo check 2>&1 | tee cargo-check.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "### cargo check failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -80 cargo-check.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
      - name: Rust tests
        shell: bash
        working-directory: src-tauri
        run: |
          set +e
          cargo test --lib 2>&1 | tee cargo-test.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "### cargo test failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -80 cargo-test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
      - name: Publish failure log
        if: failure() && matrix.os == 'windows-latest'
        shell: bash
        run: |
          {
            echo '### cargo check'
            cat src-tauri/cargo-check.log 2>/dev/null || true
            echo
            echo '### cargo test'
            cat src-tauri/cargo-test.log 2>/dev/null || true
          } > ci-error.log
          git config user.name "workLog CI"
          git config user.email "ci@worklog.local"
          git checkout -B ci-debug
          git add -f ci-error.log
          git commit -m "ci: windows compile error"
          git push -f origin ci-debug
