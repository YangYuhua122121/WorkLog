name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: JS syntax
        run: |
          node --check src/app.js
          node --check src/api.js
          node --check src/clip.js
      - name: Rust check
        shell: bash
        working-directory: src-tauri
        run: |
          set +e
          cargo check 2>&1 | tee cargo-check.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "### cargo check failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -80 cargo-check.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
      - name: Rust tests
        shell: bash
        working-directory: src-tauri
        run: |
          set +e
          cargo test --lib 2>&1 | tee cargo-test.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "### cargo test failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -80 cargo-test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
