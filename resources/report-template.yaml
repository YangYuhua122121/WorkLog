# ==============================================================
# workLog · 报告模板配置（report-template.yaml）
# --------------------------------------------------------------
# 报告长什么样，全看这个文件。你只要改下面三块：
#
#   1. 字段对照   给你要用的数据起个名字
#   2. 自定义文字 把上面的名字拼成一句「模板句」
#   3. 报告正文   日报 / 周报 / 月报，{} 里写上面的名字
#
# {} 的写法：
#   {项目名}          引用「字段对照」里的名字
#   {成果句}          引用「自定义文字」里的名字
#   一次可以连写好几个：{项目名} · {任务名}：{成果}
#
# 展开规则：
#   · 字段对照右边以 agg_ 开头 = 整个周期就一个值（总时长、项目数…），直接填进去
#   · 其他字段 = 每条记录一个值，引用一次就展开成多行
#   · 一条记录里只要有一个字段是空的，这一条就不输出
#   · 展开后完全重复的行会自动去掉
#
# 小提示：
#   · 只想改措辞结构 → 改第 3 块
#   · 想加一行信息   → 先在第 1 块起个名字，再到第 3 块引用
#   · 想把同一句话复用 → 在第 2 块起个「模板句」，第 3 块引用它
#   · 报告只写两件事：工作成果、工作计划；时间与数字由系统给出，别写死
# ==============================================================

# ---- 1. 字段对照 ----
# 左边你随便起名，右边是系统里的字段（一般不用动）
字段对照:
  日期: period_date
  周期: period_label
  项目名: project_name
  任务名: task_name
  成果: result
  下一步: next_goal
  时长: duration
  优先级: priority
  截止日期: due_date
  总时长: agg_total_duration
  项目数: agg_project_count
  任务数: agg_task_count

# ---- 2. 自定义文字 ----
# 左边你起的名字，右边是用 {} 拼出来的模板句
自定义文字:
  成果句: "{项目名} · {任务名}：{成果}"
  计划句: "{项目名} · {任务名}：{下一步}"

# ---- 3. 报告正文 ----
# 日报给「当日」用，周报给「本周 / 上周」用，月报给「本月 / 上月」用
日报: |
  {日期} 工作日报

  【工作成果】
  {成果句}

  【工作计划】
  {计划句}

周报: |
  {周期} 工作周报

  【本周工作成果】
  {成果句}

  【下周工作计划】
  {计划句}

月报: |
  {周期} 工作月报

  【本月工作成果】
  {成果句}

  【下月工作计划】
  {计划句}
