# ==============================================================
# workLog · 报告模板配置（report-template.yaml）
# --------------------------------------------------------------
# 报告由三部分拼出来：
#   1) 数据库字段映射：替代字段 → 数据库源字段（一般不用改）
#   2) 自定义字段：用替代字段拼出来的字符串（可逐条展开成多行）
#   3) 最终格式化文档：日报 / 周报 / 月报，用 {} 引用上面的字段
#
# 占位符约定：
#   {字段}        单行标量替换，例如 {项目名}
#   {自定义字段}   自定义字段：text 型替换成一段文字；
#                  list 型按记录逐条展开成多行（每条记录渲染一次 text）
#   正文多行用 YAML 块标量 | 书写，换行与缩进原样保留
#   取值为空时：list 型跳过该条，text 型替换为空字符串
#   同一行可以连续引用多个字段，如 "{项目名} · {任务名}：{阶段成果}"
#
# 报告只写两件事：工作成果、工作计划；时间 / 数字由系统按固定规则
# 给出，模板里不出现任何具体日期与时长字样。
# ==============================================================

meta:
  version: 2
  name: 默认报告模板
  locale: zh-CN

# --------------------------------------------------------------
# 1. 数据库字段映射
#    左侧 = 本文件内使用的「替代字段」，右侧 = 数据库源字段
#    增删字段时只改这一段，下面的自定义字段与文档不用动
# --------------------------------------------------------------
fields:
  日期: period_date
  周期: period_label
  项目名: project_name
  任务名: task_name
  阶段号: stage_id
  阶段成果: result
  下一目标: next_goal
  时长: duration
  优先级: priority
  截止日期: due_date
  任务状态: status
  总时长: agg_duration
  项目数: agg_project_count
  任务数: agg_task_count

# --------------------------------------------------------------
# 2. 自定义字段
#    text 型：整个周期只渲染一次
#    list 型：按记录逐条渲染，每条记录一行
#    skip_if_empty：指定的替代字段为空时跳过该条
#    distinct：去掉完全重复的行
# --------------------------------------------------------------
custom:
  工作成果:
    type: list
    source: stages
    text: "{项目名} · {任务名}：{阶段成果}"
    skip_if_empty: 阶段成果
    distinct: true
  工作计划:
    type: list
    source: stages
    text: "{项目名} · {任务名}：{下一目标}"
    skip_if_empty: 下一目标
    distinct: true
  投入概览:
    type: text
    source: aggregate
    text: "本期共投入 {总时长}，覆盖 {项目数} 个项目、{任务数} 个任务。"

# --------------------------------------------------------------
# 3. 最终格式化文档
#    日报 / 周报 / 月报各一份；正文用块标量 | 多行书写，
#    每个占位符独占一行时，展开后仍是多行结构
# --------------------------------------------------------------
documents:
  日报:
    标题: "{日期} 工作日报"
    正文: |
      【工作成果】
      {工作成果}

      【工作计划】
      {工作计划}
  周报:
    标题: "{周期} 工作周报"
    正文: |
      【本周工作成果】
      {工作成果}

      【下周工作计划】
      {工作计划}
  月报:
    标题: "{周期} 工作月报"
    正文: |
      【本月工作成果】
      {工作成果}

      【下月工作计划】
      {工作计划}
