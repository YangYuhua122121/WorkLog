# ==============================================================
# workLog · 报告固定格式化模板配置（report-template.yaml）
# --------------------------------------------------------------
# 作用：定义「报告长什么样」——章节顺序、每个章节取哪些字段、
#      字段怎么排版、空值怎么占位。Rust 侧读取本文件渲染出初稿，
#      再把初稿 + 原始数据交给「报告撰写 Skill」做语言层改写。
# 边界：本文件只管结构与格式，不涉及措辞；措辞规则在 report-skill.md。
# 修改方式：可直接编辑本文件，保存后在应用内点「重新生成报告」生效。
# ==============================================================

meta:
  version: 1
  name: 默认报告模板
  locale: zh-CN
  timezone: local
  encoding: UTF-8

# --------------------------------------------------------------
# 报告抬头：按周期取不同标题
# --------------------------------------------------------------
periods:
  当日:
    title: "{date} 工作日报"
    label: 当日
    sections: [investment, main_output, next_goal, todo]
  本周:
    title: "第 {week} 周 周报"
    label: 本周
    sections: [investment, main_output, next_goal, todo]
  本月:
    title: "{year} 年 {month} 月 月报"
    label: 本月
    sections: [investment, main_output, next_goal, todo]
  上周:
    title: "第 {week} 周 周报"
    label: 上周
    sections: [investment, main_output, next_goal, todo]
  上月:
    title: "{year} 年 {month} 月 月报"
    label: 上月
    sections: [investment, main_output, next_goal, todo]

# --------------------------------------------------------------
# 章节定义：sections 里的 id 在上面按周期引用
#   type: paragraph | list | table | stats
#   source: stages（阶段明细）| project_task（项目-任务）| aggregate（聚合结果）
# --------------------------------------------------------------
sections:
  - id: investment
    title: "{period_label}投入"
    type: paragraph
    source: stages
    group_by: project
    item_template: "{project_name} · {task_name}（{duration}）"
    joiner: "；"
    tail: "。"
    empty_text: "（本周期无记录）"

  - id: main_output
    title: 主要产出
    type: list
    source: stages
    item_template: "{result}"
    joiner: "；"
    dedupe: true
    max_items: 12
    empty_text: "（本周期暂无阶段成果）"

  - id: next_goal
    title: 下一目标
    type: list
    source: stages
    item_template: "{project_name} · {task_name}：{next_goal}"
    joiner: "；"
    dedupe: true
    max_items: 8
    empty_text: "（未填写下一目标）"

  - id: todo
    title: 待办与风险
    type: list
    source: project_task
    filter:
      status: 未完成
    sort:
      by: priority
      order: asc
    item_template: "[{priority}] {project_name} · {task_name}（DDL {due_date}）"
    empty_text: "（无未完成事项）"

# --------------------------------------------------------------
# 字段格式化规则
# --------------------------------------------------------------
formats:
  date: "YYYY-MM-DD"
  duration: "{hours} 小时 {minutes} 分钟"
  percent: "{value}%"
  int: "{value}"

# --------------------------------------------------------------
# 取数与排版的硬规则（渲染与 AI 改写都必须遵守）
# --------------------------------------------------------------
rules:
  - 只使用数据源里真实存在的字段，不推断、不补写未记录的内容
  - 阶段成果 / 下一目标为空时使用该章节的 empty_text 占位，不留空行
  - 时长统一走 formats.duration，不出现「3.5h」「3小时30分」等混合格式
  - 占比四舍五入保留一位小数，各项占比合计为 100%
  - 项目名 / 任务名使用数据库中的原始名称，不改写、不缩写
  - 章节顺序、标题文字以本文件的定义为准，AI 不得增删章节

# --------------------------------------------------------------
# AI 改写（可选）：未配置 API Key 时跳过，直接输出初稿
# --------------------------------------------------------------
ai:
  enabled: true
  skill_file: report-skill.md      # 与本文件同目录
  max_tokens: 2000
  temperature: 0.3
  keep_structure: true             # 保留本模板的章节与顺序
  fallback_to_template: true       # 调用失败时回退初稿
